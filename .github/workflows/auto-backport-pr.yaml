# auto-backport-pr.yml
# This workflow is triggered when a pull request is merged.
#
# TEMPLATE: this workflow calls a reusable workflow that YOU host and manage.
# Keep this file only if your project uses automated backport PRs.
# Otherwise delete this file.
#
# Required setup if you keep this workflow:
# - Set jobs.if_merged.uses to your reusable workflow reference.
# - Set with.project_base_name.
name: Auto-PR (for backporting to version branches)

on:
  pull_request:
    branches:
      - main
      - "[0-9]+"
      - "[0-9]+.[0-9]+"
    types:
      - closed
  workflow_dispatch:

jobs:
  if_merged:
    uses: josh-wong/actions/.github/workflows/auto-pr-reusable.yaml@main
    secrets: inherit
    with:
      project_base_name: "Tegata" # Required. Base project name used by the reusable workflow.
