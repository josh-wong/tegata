# auto-assign-and-label.yaml
#
# TEMPLATE: this workflow auto-assigns issues and pull requests to a fixed
# GitHub username, and copies labels from a linked issue onto its pull
# request (mapping "bug" to "bugfix"). Update the ASSIGNEE env value below
# for a different project, or delete this file if this project doesn't want
# automatic assignment or label syncing.
name: Auto-assign and label

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      ASSIGNEE: josh-wong
    steps:
      - name: Assign issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [process.env.ASSIGNEE],
            });

  assign-and-label-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      ASSIGNEE: josh-wong
    steps:
      - name: Assign PR and sync labels from linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const assignee = process.env.ASSIGNEE;
            const pr = context.payload.pull_request;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [assignee],
            });

            // Find a linked issue via closing keywords (e.g. "Resolves #123",
            // "Fixes #123", "Closes #123") in the PR body. This is the same
            // syntax GitHub uses to populate the "Development" section, so a
            // PR written per the pull_request_template.md will link
            // automatically once merged into the default branch.
            const body = pr.body || '';
            const match = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!match) {
              console.log('No linked issue found in PR body; skipping label sync.');
              return;
            }

            const issueNumber = Number(match[1]);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels
              .map((label) => (typeof label === 'string' ? label : label.name))
              .map((name) => (name === 'bug' ? 'bugfix' : name));

            if (labels.length === 0) {
              console.log(`Issue #${issueNumber} has no labels; skipping label sync.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels,
            });

